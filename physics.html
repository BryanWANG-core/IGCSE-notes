<!-- PHYSICS webpage by Bryan (IGCSE 0625) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGCSE Physics Notes | Bryan's Vault</title>
  
  <!-- Chart.js for Dynamic Graphing -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* Deep Navy Blue Background Matching Home Screen (#273b66) */
      --bg-color: #273b66;
      --card-bg: rgba(20, 32, 60, 0.75);
      --card-bg-inner: rgba(15, 25, 48, 0.6);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Vibrant Light Sky Blue Accent System */
      --accent-blue: #38bdf8;
      --accent-blue-bright: #7dd3fc;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-btn {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .back-btn:hover {
      color: var(--accent-blue-bright);
      transform: translateX(-3px);
    }

    .header-box {
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      color: #fff;
      margin: 0 0 6px 0;
      font-size: 2rem;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .code-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue-bright);
      border: 1px solid rgba(56, 189, 248, 0.4);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Auth Banner / Cloud Sync Status */
    .auth-banner {
      background: var(--card-bg-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.85rem;
    }

    .auth-status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a3e635; /* Green for local/active */
      box-shadow: 0 0 8px #a3e635;
    }

    .auth-btn {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue-bright);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .auth-btn:hover {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Main Content Card */
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      backdrop-filter: blur(12px);
      margin-bottom: 30px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
    }

    .content-card h2 {
      color: #fff;
      margin-top: 0;
      font-size: 1.4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    /* Statistics Dashboard Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-box {
      background: var(--card-bg-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }

    .stat-box:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .stat-box h4 {
      margin: 0 0 6px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      color: var(--accent-blue-bright);
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0;
    }

    /* Tracker Form Styling */
    .tracker-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
      background: var(--card-bg-inner);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      background: #121c33;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* Minimalist Collapsible Accordion for Topics */
    .topic-accordion-btn {
      width: 100%;
      background: #121c33;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .topic-accordion-btn:hover {
      border-color: var(--accent-blue);
    }

    .topics-selector-box {
      background: #0f182e;
      border: 1px solid var(--border);
      border-top: none;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      max-height: 240px;
      overflow-y: auto;
    }

    .topic-checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }

    .topic-checkbox-label input {
      accent-color: var(--accent-blue);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .submit-btn {
      grid-column: 1 / -1;
      background: var(--accent-blue);
      color: #0b1329;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .submit-btn:hover {
      background: var(--accent-blue-bright);
      transform: translateY(-1px);
    }

    /* Interactive Graph Section */
    .chart-controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .chart-btn {
      background: var(--card-bg-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chart-btn:hover, .chart-btn.active {
      border-color: var(--accent-blue);
      color: var(--accent-blue-bright);
      background: rgba(56, 189, 248, 0.1);
    }

    .chart-container {
      position: relative;
      margin-top: 20px;
      padding: 20px;
      background: var(--card-bg-inner);
      border-radius: 10px;
      border: 1px solid var(--border);
      min-height: 280px;
      max-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Advice Card */
    .analysis-card {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 20px;
      margin-top: 25px;
    }

    .analysis-card h3 {
      margin-top: 0;
      color: var(--accent-blue-bright);
      font-size: 1.05rem;
    }

    .analysis-card p {
      color: var(--text-muted);
      margin-bottom: 0;
      font-size: 0.95rem;
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
      margin-top: 25px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .tracker-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .tracker-table th, .tracker-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .tracker-table th {
      background: #121c33;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tracker-table td {
      font-size: 0.9rem;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    /* Resource Accordion */
    .resource-accordion {
      margin: 20px 0 25px 0;
    }

    .accordion-btn {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-btn:hover {
      border-color: var(--accent-blue);
    }

    .accordion-panel {
      background: var(--card-bg-inner);
      border: 1px solid var(--border);
      border-top: none;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      padding: 20px;
      margin-top: -4px;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .resource-card h3 {
      margin-top: 0;
      color: #fff;
      font-size: 0.95rem;
    }

    .resource-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .resource-list {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .resource-list li {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    .resource-list a {
      color: var(--accent-blue-bright);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .resource-list a:hover {
      text-decoration: underline;
    }

    .resource-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
